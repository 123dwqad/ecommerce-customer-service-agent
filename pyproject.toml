[project]
name = "commerce-agent"
version = "0.1.0"
description = "E-commerce customer-support Agent"
authors = [{name = "dz"}]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.135.1,<0.136",
    "uvicorn>=0.41,<0.42",
    "sqlalchemy>=2.0.44,<3",
    "pymysql>=1.1.1,<2",
    "redis>=7.3,<8",
    "langchain-openai>=1.1.11,<2",
    "langgraph>=1.0,<2",
    "mcp>=1.22,<2",
    "fastmcp>=3.1.1,<4",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<0.29",
    "Pillow>=11.1,<13",
    "pdfplumber>=0.11.5,<0.12",
    "qdrant-client>=1.15,<2",
    "langchain-text-splitters>=0.3,<1",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
